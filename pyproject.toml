[project]
name = "dify-kb-port"
version = "0.1.0"
description = "Export, import and verify Dify knowledge bases chunk-for-chunk using only the public Knowledge API"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["dify", "rag", "knowledge-base", "backup", "migration"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = ["httpx==0.28.1"]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/dify-kb-port"

[project.scripts]
dify-kb-port = "dify_kb_port.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
